version: '3.8'

services:
  # Nginx Reverse Proxy + SSL
  nginx:
    image: nginx:latest
    container_name: nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./backend/uploads:/var/www/uploads:ro
    depends_on:
      - backend
    restart: always
    networks:
      - tutor_network
    environment:
      - TZ=Asia/Ho_Chi_Minh

  # Backend API - Production
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: backend_prod
    env_file: ./backend/.env
    environment:
      - ENVIRONMENT=production
    depends_on:
      - redis
    restart: always
    networks:
      - tutor_network
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-securepassword}
    container_name: redis_prod
    volumes:
      - redis_data:/data
    restart: always
    networks:
      - tutor_network
    expose:
      - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
    driver: local

networks:
  tutor_network:
    driver: bridge
  redis_data:
